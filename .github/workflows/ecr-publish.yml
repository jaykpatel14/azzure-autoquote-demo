name: Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ecr-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-push:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autoquote
          POSTGRES_PASSWORD: autoquote
          POSTGRES_DB: autoquote
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U autoquote -d autoquote"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
      AUTH_SECRET: ci-test-auth-secret
      AUTH_URL: http://localhost:3000
      AZZURE_ADMIN_EMAILS: admin@azzure.com
      APP_SETTINGS_ENCRYPTION_KEY: ci-test-settings-key
      DATABASE_URL: postgresql://autoquote:autoquote@127.0.0.1:5432/autoquote?schema=public
      METALS_DEV_API_KEY: ci-test-metals-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      OPENAI_API_KEY: ci-test-openai-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed test data
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Show GitHub repository IDs
        run: |
          echo "Organization ID: ${{ github.repository_owner_id }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: AzzureAutoquoteECR

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Build application image
        run: |
          docker build \
            --target runner \
            -t "$IMAGE_URI" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

      - name: Build migration image
        run: |
          docker build \
            --target migrator \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}-migrator" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest-migrator" \
            .

      - name: Push Docker images
        run: |
          docker push "$IMAGE_URI"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}-migrator"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest-migrator"
