name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - Build and Push to ECR
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy"
        required: true
        type: string

concurrency:
  group: ec2-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine image tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: AzzureAutoquoteEC2

      - name: Deploy to EC2 through SSM
        shell: bash
        run: |
          DEPLOY_SCRIPT_B64="$(base64 -w0 deploy.sh)"

          COMMANDS=$(jq -nc \
            --arg script "${DEPLOY_SCRIPT_B64}" \
            --arg region "${AWS_REGION}" \
            --arg repo "${ECR_REPOSITORY}" \
            --arg tag "${IMAGE_TAG}" \
            '[
              "printf %s \"\($script)\" | base64 -d >/tmp/azzure-autoquote-deploy.sh",
              "chmod 700 /tmp/azzure-autoquote-deploy.sh",
              "AWS_REGION=\($region) ECR_REPOSITORY=\($repo) /tmp/azzure-autoquote-deploy.sh \($tag)"
            ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy AutoQuote ${{ github.sha }}" \
            --parameters "commands=${COMMANDS}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: ${COMMAND_ID}"

          STATUS=""
          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "${STATUS}" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed|"")
                echo "SSM command status: ${STATUS:-Unavailable} (attempt ${attempt}/120)"
                sleep 10
                ;;
              *)
                echo "SSM command status: ${STATUS} (attempt ${attempt}/120)"
                sleep 10
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text || true

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "Deployment failed with status: ${STATUS}"
            exit 1
          fi
