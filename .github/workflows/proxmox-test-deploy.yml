name: Proxmox Test Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop

concurrency:
  group: proxmox-test-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    env:
      PROXMOX_PROJECT_DIR: /opt/docker/projects/azzure-autoquote-mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync project files to Proxmox directory
        run: |
          set -euo pipefail
          echo "📁 Syncing files to $PROXMOX_PROJECT_DIR..."
          mkdir -p "$PROXMOX_PROJECT_DIR"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env.proxmox' \
            --exclude '.env.proxmox.example' \
            ./ "$PROXMOX_PROJECT_DIR"/

      - name: Deploy stack on the self-hosted runner
        working-directory: ${{ env.PROXMOX_PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "🗄️ [1/5] Starting PostgreSQL database container..."
          docker compose -f docker-compose.proxmox.yml up -d db

          echo "⏳ Waiting for PostgreSQL to be ready..."
          DB_READY=0
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.proxmox.yml exec -T db pg_isready -U autoquote -d autoquote >/dev/null 2>&1 || \
               docker compose -f docker-compose.proxmox.yml exec -T db pg_isready -U postgres >/dev/null 2>&1 || \
               docker compose -f docker-compose.proxmox.yml exec -T db pg_isready >/dev/null 2>&1; then
              echo "✅ PostgreSQL is ready and accepting queries on attempt $attempt!"
              DB_READY=1
              break
            fi
            echo "   ...waiting for postgres (attempt $attempt/30)..."
            sleep 2
          done

          if [ "$DB_READY" -ne 1 ]; then
            echo "❌ ERROR: PostgreSQL failed to become ready within 60 seconds."
            echo "📋 PostgreSQL container status:"
            docker compose -f docker-compose.proxmox.yml ps
            echo "📋 PostgreSQL container logs:"
            docker compose -f docker-compose.proxmox.yml logs --tail=100 db
            exit 1
          fi

          echo "🔨 [2/5] Building Next.js app and migrator Docker containers..."
          DOCKER_BUILDKIT=1 docker compose -f docker-compose.proxmox.yml build --progress=plain app migrate
          echo "✅ Docker build complete!"

          echo "📦 [3/5] Applying Prisma migrations, seed, and data backfill..."
          docker compose -f docker-compose.proxmox.yml run --rm migrate npm run db:deploy
          docker compose -f docker-compose.proxmox.yml run --rm migrate npm run db:seed
          docker compose -f docker-compose.proxmox.yml run --rm migrate npm run db:backfill-selling-price
          echo "✅ Database migrations and seeds complete!"

          echo "🌐 [4/5] Starting production application container on port 8585..."
          docker compose -f docker-compose.proxmox.yml up -d --remove-orphans app

          echo "🔍 [5/5] Verifying application health endpoint..."
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8585/api/health >/dev/null 2>&1; then
              echo "✅ Health check PASSED on attempt $attempt! Application is live."
              exit 0
            fi
            echo "   ...waiting for app to respond (attempt $attempt/20)..."
            sleep 3
          done

          echo "⚠️ Health check timed out. Showing application container logs:"
          docker compose -f docker-compose.proxmox.yml logs --tail=100 app
          docker compose -f docker-compose.proxmox.yml ps
          echo "⚠️ Final health check attempt..."
          curl -fsS http://127.0.0.1:8585/api/health
          exit 1
