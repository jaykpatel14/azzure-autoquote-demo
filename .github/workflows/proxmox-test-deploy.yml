name: Proxmox Test Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop

concurrency:
  group: proxmox-test-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    env:
      PROXMOX_PROJECT_DIR: /opt/docker/projects/azzure-autoquote-mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync project files to Proxmox directory
        run: |
          set -euo pipefail
          mkdir -p "$PROXMOX_PROJECT_DIR"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env.proxmox' \
            --exclude '.env.proxmox.example' \
            ./ "$PROXMOX_PROJECT_DIR"/

      - name: Deploy stack on the self-hosted runner
        working-directory: ${{ env.PROXMOX_PROJECT_DIR }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.proxmox.yml up -d db
          until docker compose -f docker-compose.proxmox.yml exec -T db pg_isready -U autoquote -d autoquote >/dev/null 2>&1; do
            sleep 2
          done
          DOCKER_BUILDKIT=1 docker compose -f docker-compose.proxmox.yml build --progress=plain app migrate
          docker compose -f docker-compose.proxmox.yml run --rm migrate npm run db:deploy
          docker compose -f docker-compose.proxmox.yml run --rm migrate npm run db:seed
          docker compose -f docker-compose.proxmox.yml run --rm migrate npm run db:backfill-selling-price
          docker compose -f docker-compose.proxmox.yml up -d --remove-orphans app
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8585/api/health >/dev/null 2>&1; then
              echo "✅ Local health check passed on attempt $attempt"
              exit 0
            fi
            echo "Waiting for app container to become healthy (attempt $attempt/20)..."
            sleep 3
          done
          curl -fsS http://127.0.0.1:8585/api/health || true
