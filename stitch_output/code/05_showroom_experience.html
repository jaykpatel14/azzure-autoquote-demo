<script>
        // Simple interaction script to demonstrate state changes
        document.addEventListener('DOMContentLoaded', () => {
            const metalButtons = document.querySelectorAll('button:has(.swatch-platinum), button:has(.swatch-gold)');
            
            metalButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Reset all
                    metalButtons.forEach(b => {
                        b.classList.remove('border-2', 'border-primary', 'bg-surface-container-low');
                        b.classList.add('border', 'border-outline-variant');
                    });
                    
                    // Set active
                    const target = e.currentTarget;
                    target.classList.remove('border', 'border-outline-variant');
                    target.classList.add('border-2', 'border-primary', 'bg-surface-container-low');
                });
            });
        });
    </script>
